# The documentation site, which is this folder served by GitHub Pages.
#
# Nothing here is built by us: Pages runs Jekyll, Jekyll fetches the theme
# from its repository, and the pages are the same Markdown files that are
# readable on GitHub. The only site-only syntax allowed in them is the front
# matter at the top, which GitHub renders as a small table and the theme
# reads for the navigation.
#
# To see it before it is published, from the repository root:
#
#   docker run --rm -it -p 4000:4000 -v "$PWD/docs:/docs:ro" ruby:3.3 sh -c \
#     'cp -r /docs /site && cd /site && gem install github-pages -N >/dev/null \
#      && jekyll serve --host 0.0.0.0'
#
# then open http://localhost:4000/Geeboard/.

title: Geeboard
description: An open-source panel that runs game servers on machines you already have.
url: https://danielemarino70.github.io
baseurl: /Geeboard

remote_theme: just-the-docs/just-the-docs

# jekyll-relative-links is what keeps a link like [games.md](games.md#shipped)
# working in both places: GitHub follows the file, and on the site the plugin
# turns it into that page's URL, fragment and all. Pages enables it by
# default; it is named here so a local build behaves the same way.
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

# The theme's own settings.
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Geeboard on GitHub":
    - "https://github.com/DanieleMarino70/Geeboard"
aux_links_new_tab: true

footer_content: >-
  Geeboard is licensed AGPL-3.0-only. The games are not part of Geeboard.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
