# What publishes <https://danielemarino70.github.io/Geeboard/>.
#
# The site is built here and nowhere else: `docs/` holds Markdown and only
# Markdown, and no commit carries generated HTML. That is the whole reason
# this workflow exists instead of a `site/` directory in the repository.
#
# It needs the repository's Pages setting to be "GitHub Actions" rather than
# "Deploy from a branch". Until somebody changes it, this workflow builds and
# checks the site on every push and publishes nothing, and the old Jekyll site
# keeps answering — which is the safe way round.
#
# A pull request gets the build and the link check and no deployment: the
# check is the point, and it fails on a dead link or a missing anchor before
# the page is anywhere near the published site.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-src/**"
      - "brand/**"
      - "web/package.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-src/**"
      - "brand/**"
      - "web/package.json"
      - ".github/workflows/docs.yml"
  # So a page can be republished without a commit to force it.
  workflow_dispatch:

# Reading is all the site's build needs; only the publishing job below is
# given the two rights that deploying to Pages takes.
permissions:
  contents: read

# One deployment at a time, and a running one is never cancelled: a half
# published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # configure-pages asks the Pages API about the site; it publishes nothing.
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs-src/package-lock.json

      - run: npm ci
        working-directory: docs-src

      - name: Build the site
        run: node docs-src/build.mjs

      # Every internal link, every anchor, every address the old site served,
      # and every code block against the Markdown it came from.
      - name: Every link answers
        run: node docs-src/check-links.mjs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # The build writes .nojekyll, and the artifact action has not
          # included dotfiles since v4 unless asked to.
          include-hidden-files: true

  deploy:
    name: Publish
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
