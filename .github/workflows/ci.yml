# What a push and a pull request are checked against.
#
# Everything that needs nothing but a database runs here: lint,
# typecheck, the unit tests of both packages, and the verify scripts that
# only want Postgres. The ones that drive real containers — verify:agent,
# :registration, :console, :poller, :files, :create, :backups, and the
# agent's integration file — stay local, because each starts an agent
# against a real Docker engine, pulls game images and binds host ports.
# `npm run verify:all` in web/ is what runs those, on a machine with
# Docker; see docs/development.md.
#
# Two scripts in `npm run verify` do start a real agent, against the Docker
# engine a GitHub runner has and with nothing but alpine to pull: :templates
# (a world copied through a stand-in bucket) and :community (a container made
# from an image named by digest). They run the agent from daemon/ with its own
# packages, which is why the panel job installs them. Since 0.5.0 added the
# first, this job failed at "timed out waiting for agent" until it did.
#
# The runner is named, never `ubuntu-latest`: that label moves to Ubuntu 26.04
# from 2026-10-19, over several weeks, and a red run then has two possible
# causes and no quick way to tell which. 24.04 is what the code is held to;
# 26.04 (the OS of the project's own test VPS) runs beside it and may fail
# without failing the run, until somebody reads it and decides.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Called by release.yml, so a tag is checked by exactly the same jobs a
  # branch is rather than by a copy of them that drifts.
  workflow_call:
  # So the checks can be run on a branch without a commit to force them.
  workflow_dispatch:

# Nothing here writes to the repository or to a registry. A called workflow
# can only narrow what its caller grants, so this is also the most a tag
# run's install of ~700 npm packages gets next to the release token.
permissions:
  contents: read

# A newer push to a branch makes the run of the older one pointless. A tag is
# never cancelled: the release waits on it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_call' }}

jobs:
  panel:
    name: Panel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    defaults:
      run:
        working-directory: web

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geeboard
          POSTGRES_PASSWORD: geeboard
          # Named as the scripts that wipe a database require: every verify
          # script refuses a URL that does not say it is a verify database,
          # since a run against the wrong one once cost a demo.
          POSTGRES_DB: geeboard_verify
        ports: ["5432:5432"]
        # Steps start as soon as the container does, which is before
        # Postgres takes a connection; without this the first one fails.
        options: >-
          --health-cmd "pg_isready -U geeboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://geeboard:geeboard@localhost:5432/geeboard_verify?schema=public
      # Real secrets for a throw-away database: the panel refuses to start
      # on anything that looks like an example, which is the point of them.
      SESSION_SECRET: ci-Qm7Lx2Vc9Bn4Kp6Jh8Gf3Ds5Aa1Zz0WwTt
      SECRETS_KEY: ci-Yt5Re3Wq1Pl9Ok7Ij2Uh4Yg6Tf8Rd0EsAb
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      # What verify:templates and verify:community start as their agent.
      - name: Install the agent's packages
        run: npm ci
        working-directory: daemon

      # What both packages ship is permissive or named, with the reason, in scripts/licenses.mjs: a dependency whose license nobody
      # looked at is how a project learns it ships something it may not.
      - name: Every license that is shipped has been read
        run: node ../scripts/licenses.mjs

      - run: npm run lint
      - run: npm run typecheck

      # Schema first: every script below reseeds the database it is given.
      # `npm run verify` runs the unit tests as its first entry, and goes on
      # after a failure to say everything that failed rather than the first.
      - run: npm run db:deploy
      - name: Verify the operations, the API and the installation flow
        run: npm run verify

      # The build the production image runs, and where a type error in a
      # page or a server action shows up.
      - run: npm run build
        env:
          NODE_ENV: production

  agent:
    name: Node agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    defaults:
      run:
        working-directory: daemon

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: daemon/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # Not `verify`: that includes integration.test.ts, which drives real
      # containers and belongs on a machine with Docker.
      - run: npm run test:unit

  # The oldest Node the documentation promises (22), for the two things that
  # run without a database: the type check and the unit tests of both
  # packages. The images and the main jobs run on 24; this is what keeps
  # "Node 22 or newer" a sentence somebody tested.
  floor:
    name: Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Nothing here connects: `prisma generate` reads the URL from prisma.config.ts and refuses to run without one,
      # and the unit tests expect the panel's two secrets to look like secrets. The same values the Panel job uses.
      DATABASE_URL: postgresql://geeboard:geeboard@localhost:5432/geeboard_verify?schema=public
      SESSION_SECRET: ci-Qm7Lx2Vc9Bn4Kp6Jh8Gf3Ds5Aa1Zz0WwTt
      SECRETS_KEY: ci-Yt5Re3Wq1Pl9Ok7Ij2Uh4Yg6Tf8Rd0EsAb
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            daemon/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx prisma generate
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      - run: npm ci
        working-directory: daemon
      - run: npm run typecheck
        working-directory: daemon
      - run: npm run test:unit
        working-directory: daemon

  installers:
    name: Installers and repository (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # What a repository must be before anything is built from it: text
      # that is text. A raw NUL in a source file made git treat it as
      # binary and hid it from every diff and every search.
      - name: The repository is what it says it is
        run: node scripts/check-repo.mjs
      # The shell that installs the other two had no checks of its own
      # until an installation was asked for an address and answered `y`.
      # Pure helpers only: no Docker, no writing outside a temp directory.
      - name: The shared helpers do what they say
        run: bash deploy/lib/verify.sh
      # A script that does not parse is one nobody can run, and the
      # failure arrives on somebody else's server.
      - name: Every installer parses
        run: |
          find deploy -name '*.sh' -print0 | xargs -0 -n1 bash -n
          for lib in deploy/lib/*.sh deploy/panel/init.sh; do
            sh -n "$lib"   # these are sourced by /bin/sh as well
          done
      # What shellcheck calls a warning in an installer is the kind that ends a run under `set -e` without a word (a grep that
      # finds nothing inside $(...)), eats a value, or word-splits a path. Clean at this level, and kept clean.
      - name: shellcheck, at warning level
        run: find deploy -name '*.sh' -print0 | xargs -0 shellcheck -x -S warning
      # release.yml only ever ran for a tag, which is public by then: an expression that does not parse, a job that needs one that
      # is not there, or a shell step shellcheck reads as broken was found at the worst moment. They are read here, on every push.
      - name: The workflows parse (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  image:
    name: Panel image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Proves the Dockerfile still builds — it has its own lock file
      # install and its own type check, and has broken while the checkout
      # was fine (a script importing from daemon/, which is not in its
      # build context).
      - run: docker build -t geeboard-panel:ci web
      - name: The image's verbs answer
        run: docker run --rm --entrypoint sh geeboard-panel:ci -c 'test -x /usr/local/bin/geeboard && node_modules/.bin/next --version'

  # The agent's image was first built at tag time, which is public by then: a Dockerfile that stopped building, or an image that
  # builds and does not answer, was found when a node tried to pull it. Built here on every push, and asked what it is.
  agent-image:
    name: Agent image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t geeboard-agent:ci daemon
      - name: The image starts and answers /version with the release and the contract
        run: |
          token=$(openssl rand -hex 32)
          docker run -d --name agent-smoke \
            -e GEEBOARD_DAEMON_TOKEN="$token" -e GEEBOARD_NODE_NAME=ci -e GEEBOARD_DATA_ROOT=/tmp/geeboard-smoke \
            -v /var/run/docker.sock:/var/run/docker.sock -p 18080:8080 geeboard-agent:ci
          for _ in $(seq 1 30); do
            curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:18080/version -o version.json 2>/dev/null && break
            sleep 1
          done
          cat version.json; echo
          want=$(node -p "require('./daemon/package.json').version")
          contract=$(sed -n 's/^export const AGENT_CONTRACT = \([0-9]*\);.*/\1/p' daemon/src/contract.ts)
          node -e '
            const got = JSON.parse(require("fs").readFileSync("version.json", "utf8"));
            const [want, contract] = process.argv.slice(1);
            if (got.agent !== want) throw new Error("the agent says " + got.agent + " and daemon/package.json says " + want);
            if (String(got.contract) !== contract) throw new Error("the agent speaks contract " + got.contract + " and contract.ts says " + contract);
            if (!Array.isArray(got.features)) throw new Error("no features list");
            console.log("ok: " + got.agent + ", contract " + got.contract);
          ' "$want" "$contract"
      - name: What it said, if it did not
        if: failure()
        run: docker logs agent-smoke || true

  # The panel's installer, run: before this, nothing but its own parser had ever looked at it between releases, and the upgrade
  # from the first run to the second was a drill done by hand. Twice (the second is the upgrade and the repair), a restart, the
  # page and the health route, and the uninstaller; and the compose file read with an environment, which `docker compose config`
  # does not do for an installer that has not written one yet.
  install:
    name: Install the panel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The compose file is valid with an environment
        run: |
          {
            echo "POSTGRES_PASSWORD=ci-dummy-password"
            echo "SESSION_SECRET=ci-dummy-session-secret-0123456789abcdef"
            echo "SECRETS_KEY=ci-dummy-secrets-key-0123456789abcdef0123"
            echo "PANEL_URL=https://ci.example.test"
          } > deploy/panel/.env
          docker compose -f deploy/panel/docker-compose.yml config --quiet
          rm deploy/panel/.env
      - name: Install, on a machine that has never seen it
        run: sudo bash deploy/linux/install-panel.sh --yes --build --panel-url https://ci.example.test --owner-email ci@example.test --owner-name "CI Owner"
      - name: Install again, which is the upgrade and the repair
        run: sudo bash deploy/linux/install-panel.sh --yes --build
      - name: A restart brings it back, and it answers
        run: |
          sudo docker compose -f deploy/panel/docker-compose.yml restart panel poller
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health -o health.json 2>/dev/null && break
            sleep 2
          done
          cat health.json; echo
          grep -q '"ok":true' health.json
          curl -fsS -o /dev/null -w 'sign-in: HTTP %{http_code}\n' http://127.0.0.1:3000/sign-in
      - name: Uninstall, which leaves the data and takes the containers
        run: |
          sudo bash deploy/linux/uninstall-panel.sh --yes
          test -z "$(sudo docker compose -f deploy/panel/docker-compose.yml ps -q)"
          sudo docker volume ls -q | grep -q . && echo "the database's volume is still there, as promised"
      - name: What the installer said, if it did not work
        if: failure()
        run: |
          sudo tail -n 80 /var/log/geeboard-install.log || true
          sudo docker compose -f deploy/panel/docker-compose.yml ps -a || true
          sudo docker compose -f deploy/panel/docker-compose.yml logs --tail 60 || true

  # The job above gives the installer a panel URL and so never meets Caddy, which is the part of an installation that differs
  # most from one distribution to the next: Ubuntu 22.04 has no package for it at all (found on a clean machine, not by this
  # workflow), and the address a runner sees itself at is a NAT's, so the last check has to ask Caddy locally. This runs the
  # address mode through to the end on both. It may fail without failing the run until it has been seen green on both.
  install-caddy:
    name: Install the panel with Caddy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install with an address and Caddy's own authority
        run: sudo bash deploy/linux/install-panel.sh --yes --build --ip --caddy-repo --owner-email ci@example.test --owner-name "CI Owner"
      - name: Caddy answers for the address, and the certificate is checked against it
        run: |
          address=$(sudo sed -n 's#^PANEL_URL=https://##p' deploy/panel/.env)
          echo "address: $address"
          # openssl and not curl: curl sends no name in the handshake for an address, and Caddy then has no certificate for 127.0.0.1.
          # sudo: the authority is kept where only root reads (/etc/geeboard).
          status=$(printf 'GET /sign-in HTTP/1.1\r\nHost: %s\r\nConnection: close\r\n\r\n' "$address" |
            sudo openssl s_client -connect 127.0.0.1:443 -servername "$address" -CAfile /etc/geeboard/panel-ca.crt -verify_ip "$address" -verify_return_error -quiet 2>/dev/null |
            head -n 1 | tr -d '\r')
          echo "sign-in through Caddy: $status"
          case "$status" in "HTTP/1.1 200"*|"HTTP/2 200"*) ;; *) exit 1 ;; esac
          caddy version
      - name: The doctor has nothing to put right
        run: sudo bash deploy/linux/doctor.sh
      - name: Uninstall
        run: sudo bash deploy/linux/uninstall-panel.sh --yes
      - name: What the installer said, if it did not work
        if: failure()
        run: |
          sudo tail -n 80 /var/log/geeboard-install.log || true
          sudo journalctl -u caddy -n 40 --no-pager || true

  # Windows PowerShell 5.1 is the one the installers run under on a PC, and the only parser that matters for them: a script that
  # parses in PowerShell 7 and not in 5.1 is the usual way these break, and nothing in the repository read one under 5.1 at all.
  windows:
    name: PowerShell 5.1 (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Every script parses under Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          $bad = 0
          foreach ($file in (Get-ChildItem -Path deploy -Recurse -Filter *.ps1)) {
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $bad++
              foreach ($e in $errors) { Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
            } else { Write-Host "ok  $($file.Name)" }
          }
          if ($bad -gt 0) { exit 1 }
      - name: doctor.ps1 runs to its last line on a machine with no agent
        shell: powershell
        run: |
          # It exits 1 when it finds something to put right, and on a clean runner it does: what matters is that it ran to the end.
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\doctor.ps1 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -gt 1) { throw "doctor.ps1 exited $LASTEXITCODE" }
          if ($out -notmatch "put right") { throw "doctor.ps1 did not reach its last line" }
          if ($out -match "Exception|At line:|is not recognized|Cannot find") { throw "doctor.ps1 raised an error" }
          # The step's own status is the last native command's, which is doctor's 1: what it was asked is answered above.
          exit 0
