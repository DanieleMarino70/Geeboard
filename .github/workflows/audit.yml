# What the dependencies look like once a week, and on demand.
#
# Two reports, neither of which blocks anything: a red run here is a thing to
# read, not a push that could not be merged. It was a critical advisory in 0.8.1
# that CI printed on every run and nobody gated on; this makes the signal a job
# of its own, with the advisories somebody has read and written down
# (.github/audit-allow.json) taken out so that what is left is news.
#
# And the newest Node, on the two things that run without a database, to see
# what the next LTS will ask of the code a few months before it is the LTS.
name: Audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/audit-gate.mjs web daemon docs-src

  current-node:
    name: Newest Node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: node
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            daemon/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx prisma generate
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      - run: npm ci
        working-directory: daemon
      - run: npm run typecheck
        working-directory: daemon
      - run: npm run test:unit
        working-directory: daemon
