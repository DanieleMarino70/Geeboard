services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: geeboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geeboard
      POSTGRES_PASSWORD: geeboard
      POSTGRES_DB: geeboard
    ports:
      # This machine only. The password is the word "geeboard", and a laptop on
      # somebody else's network is not a place to offer a database to.
      - "127.0.0.1:5432:5432"
    volumes:
      - geeboard-pgdata:/var/lib/postgresql/data
    # 64 MB is Docker's default for /dev/shm, and a VACUUM on a database of a few million rows outgrows it.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geeboard -d geeboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geeboard-pgdata:
