# The panel in production: the panel, the poller, and their database.
#
# Not the docker-compose.yml at the repository's root — that one is a
# developer's Postgres on a published port with a password printed in the
# README, and it stays as it is. This one:
#
#   - publishes the database nowhere. The panel and the poller reach it on
#     the compose network and nothing else can
#   - takes every secret from .env beside this file, which init.sh writes
#     with generated values. There is no default for any of them: an unset
#     one stops compose before it starts anything
#   - publishes the panel on the loopback address only. TLS belongs to a
#     reverse proxy in front of it (docs/production.md), and sessions are
#     Secure cookies, so plain HTTP on a public port would not sign anybody
#     in anyway
#
# Node agents are not here. A node is another machine — or this one, as
# its own service: deploy/linux/install.sh.

# Its own project name. Without one, compose names a project after the
# directory it was started from — and the developer's docker-compose.yml at
# the repository root would then share it, so `down -v` here would take that
# Postgres and its volume with it. Found by running the two side by side.
name: geeboard-panel

# Docker's default log driver keeps every line for ever: with no daemon.json on the machine (a fresh VPS has none) a container's log is
# unbounded, and the poller alone writes one a pass. Three files of 10 MB each, for every service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: geeboard
      POSTGRES_DB: geeboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/panel/init.sh first}
    volumes:
      - db:/var/lib/postgresql/data
    logging: *logging
    # Docker gives a container 64 MB of /dev/shm, and Postgres' parallel workers (a parallel query, a manual VACUUM) use it: on a
    # database of a few million samples a VACUUM stopped with "could not resize shared memory segment ... No space left on device".
    shm_size: 256mb
    # Over TCP, not the socket: the official image runs a temporary server on the socket while it initialises a new database, with TCP
    # off, and a check over the socket passed while the real one was still to come; the first migrate then met a restart.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U geeboard -d geeboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  panel:
    image: ${GEEBOARD_PANEL_IMAGE:-geeboard-panel:local}
    build:
      context: ../../web
    restart: unless-stopped
    command: ["panel"]
    logging: *logging
    # /api/health runs a query: healthy is a panel that is up and a database that answers. Node, since the image has no wget or curl.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 40s
    # Compose gives a container ten seconds to stop before it is killed. The
    # panel answers a stop at once, and this is what a request in flight gets.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment: &panel-env
      DATABASE_URL: postgresql://geeboard:${POSTGRES_PASSWORD:?run deploy/panel/init.sh first}@db:5432/geeboard?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?run deploy/panel/init.sh first}
      SECRETS_KEY: ${SECRETS_KEY:?run deploy/panel/init.sh first}
      PANEL_URL: ${PANEL_URL:-}
      # Only for searching the Steam Workshop from the Mods tab. Empty is a
      # panel that still adds a mod by its link — see docs/servers.md#mods.
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # Optional. 1 lets a notification webhook reach private networks (ntfy,
      # Home Assistant on the LAN) and use plain http there. Empty is the safe
      # default; it is never a setting on a page. See docs/notifications.md.
      GEEBOARD_WEBHOOK_ALLOW_PRIVATE: ${GEEBOARD_WEBHOOK_ALLOW_PRIVATE:-}
      # How many reverse proxies are in front of the panel, for the limits that count by where a request came from. 1 is
      # the Caddy the installer sets up and the nginx block in docs/production.md. 0 for a panel reached directly: no
      # X-Forwarded-For is believed, and everybody shares one bucket. See docs/security.md.
      GEEBOARD_TRUSTED_PROXIES: ${GEEBOARD_TRUSTED_PROXIES:-1}
      # The knobs of both processes, set here from .env with their real defaults. They were read by the code and could not be set in this
      # file, so `LOG_LEVEL=debug` in .env reached nothing. LOG_FORMAT is json under a container; text is for reading at a terminal.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # How often the poller passes, and how stale the game catalog may get before it asks upstream again (six hours; 0 never).
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-15000}
      CATALOG_SYNC_INTERVAL_MS: ${CATALOG_SYNC_INTERVAL_MS:-21600000}
      # How a pass is spread, for the poller: servers read at once over all nodes; how long one node may hold a pass before the pass goes on
      # without it; how long a call to a node may take, where it names no limit of its own; and scheduled tasks run at once (never two on
      # one node). The defaults are what a hundred servers on ten nodes were measured with, in docs/servers.md#what-a-pass-costs.
      POLL_CONCURRENCY: ${POLL_CONCURRENCY:-8}
      POLL_NODE_DEADLINE_MS: ${POLL_NODE_DEADLINE_MS:-45000}
      POLL_CALL_TIMEOUT_MS: ${POLL_CALL_TIMEOUT_MS:-5000}
      TASK_CONCURRENCY: ${TASK_CONCURRENCY:-2}
      # The certificate authority behind a panel reached at an address (Caddy's `tls internal`), as one line of base64. The installer
      # writes it once Caddy has made it. The panel offers it to a node that is joining and puts its fingerprint in the Add a node
      # command, so a node on another machine needs no file copied by hand. Empty: a panel behind a name and a public authority.
      PANEL_CA_B64: ${PANEL_CA_B64:-}
    ports:
      - "${PANEL_BIND:-127.0.0.1:3000}:3000"

  poller:
    image: ${GEEBOARD_PANEL_IMAGE:-geeboard-panel:local}
    restart: unless-stopped
    command: ["poller"]
    logging: *logging
    # Healthy is a watchdog that has finished a pass within three of its own intervals (the row it writes, poller_state): the poller has no
    # port to ask, and a process that is up and stuck is the case worth seeing. `docker compose ps` says unhealthy within about a minute and a half.
    healthcheck:
      test: ["CMD", "node", "scripts/poller-health.mjs"]
      interval: 15s
      timeout: 10s
      retries: 2
      start_period: 2m
    # A stop finishes the pass that is running, and a pass can be a scheduled
    # backup, which takes minutes: ten seconds killed it mid-archive. Two
    # minutes is what the systemd unit's TimeoutStopSec is.
    stop_grace_period: 2m
    depends_on:
      db:
        condition: service_healthy
    environment: *panel-env

volumes:
  db:

# The panel's network gets a bridge with a name of its own. Docker names a bridge br- and the first twelve characters of the
# network's id, and the id changes every time the network is made again (a `down` and an `up`, an upgrade, a reinstall): a
# firewall rule that lets the panel reach its own node by that name (deploy/linux/container-firewall.sh) then stops matching,
# and the node looks unreachable for no reason anybody can see. Measured on a real machine: the rule's name was the old one, the
# new bridge met the reject, and the agent said "the panel cannot reach this node".
networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: gb-panel
